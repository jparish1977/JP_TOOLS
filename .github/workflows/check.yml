name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every tracked file of each language is checked, by listing them from git:
# a hand-kept list lets a new file go unchecked while the build is green.
# rc accumulates in every loop, so one failure never hides the files after it.
#
# The smells arm fails a smell that is NEW against --smells-base, or one that
# existed and grew, and warns on one that existed and did not grow. The base
# is the PR's, or on a push the commit before it;
# a first push has none (all zeros), which falls back to HEAD and says so,
# since against HEAD a new smell only warns. So does a base the clone does not
# have: after a force-push, the commit before it is no longer in the history.

# fleet-ci is the fleet CI image (ci-image/), served by the fleet's own runner:
# the job image with every system tool below already installed, so the
# install steps find them in place and check-pins.py confirms their pins.
#
# CI_WORKERS is how many files or suites a step runs at once. Not nproc: a
# job container sees all of the runner host's cores (32), and the runner takes
# three jobs at a time, so nproc-wide steps in each oversubscribe the box
# (load 38.5 on 32 cores measured 2026-10-09, with CI jobs running).
# MUTMUT_WORKERS is the mutation jobs' own: a run there is mutants times the
# suites' time, the longest job by far, and at 8 a PR that re-traces its reach
# waited about 70 minutes on one pass (2026-10-13). It takes the share the
# other jobs leave once they finish, which they do well before it.
env:
  CI_WORKERS: 8
  MUTMUT_WORKERS: 24

jobs:
  # Nothing relied on runs from scratch (METHODOLOGY 2.11, rule 6): the
  # pre-commit hook refuses a commit whose files name a scratch path, and this
  # refuses one made past the hook (git commit --no-verify).
  scratch:
    name: No tracked file names a scratch path
    runs-on: fleet-ci
    steps:
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      - uses: actions/checkout@v6
      - run: python3 scratch-refs.py --all

  python:
    name: Python and shell (ruff, mypy, shellcheck, suites, coverage)
    runs-on: fleet-ci
    steps:
      # A job as root reads a mode-000 file anyway, so the permission tests
      # skip and nothing says so; and root widens any escape from the job's
      # container. The fleet CI image runs jobs as ci; this fails a run that
      # is root, on whatever label.
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      # Full history: the smells arm reads the base commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Pinned from requirements-dev.txt, so a linter release that adds rules
      # is taken on purpose, with its fixes, not found in an unrelated PR.
      - run: pip install -r requirements-dev.txt
      # PHP and composer are installed explicitly: the Forgejo runner image
      # has neither, and without the PHP tools the phpstan suites would skip,
      # which reads as a pass. apt, not setup-php, because the Forgejo runner
      # cannot resolve that action. 8.3 is what phpunit ^12.5 needs and what
      # Ubuntu 24.04 ships. gd and sqlite3 are iteration8/utilities' (below).
      - name: PHP and composer
        run: |
          if ! command -v composer >/dev/null 2>&1; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -q
            $SUDO apt-get install -y -q php-cli php-xml php-mbstring php-curl php-gd php-sqlite3 unzip composer
          fi
          php --version
          composer --version
      # Declared in requirements-system.txt; the shell arm's finding cases
      # need it rather than skip.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get install -y -q shellcheck || { $SUDO apt-get update -q && $SUDO apt-get install -y -q shellcheck; }
          fi
          shellcheck --version
      # PowerShell 7 and PSScriptAnalyzer, at requirements-system.txt's
      # versions, for the PowerShell arm; the script says how.
      - name: PowerShell and PSScriptAnalyzer
        run: bash install-pwsh.sh
      # composer.json's private libraries, read with the secret
      # FLEET_READ_TOKEN from the owner in the variable LIBRARIES_OWNER; the
      # script says why when either is missing. Every job with PHP tools runs
      # this one script.
      - name: Install PHP tools
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          OWNER: ${{ vars.LIBRARIES_OWNER }}
          SERVER: ${{ github.server_url }}
        run: bash ci-image/install-php-tools.sh
      # requirements-dev.txt, composer.json and requirements-system.txt's
      # PowerShell lines read back against what the installs above put in
      # place (METHODOLOGY 7.9).
      - name: Tools installed at their pins
        run: python check-pins.py python php powershell
      # Every file is checked on its own, by CI_WORKERS workers, each taking
      # every Nth file in turn. Each file writes its own log, printed
      # afterwards in file order, so the output reads as a serial run's would.
      # Each worker has its own mypy cache: mypy processes sharing one cache
      # crashed here (INTERNAL ERROR on 6 of 149 files). Each runs with
      # `set +e`: this shell has -e, and a worker that inherited it would stop
      # at the first finding without recording its exit code.
      - name: Check every Python, shell, PHP and PowerShell file
        shell: bash
        env:
          SMELLS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$SMELLS_BASE"
          case "$base" in *[!0]*) ;; *) base="" ;; esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit $base is not in this clone's history (a force-push?)."
            base=""
          fi
          if [ -z "$base" ]; then
            echo "No base commit to judge smells against: HEAD is used, so a new smell only warns."
            base=HEAD
          fi
          out=$(mktemp -d)
          mapfile -t files < <(git ls-files '*.py' '*.sh' '*.bash' '*.php' '*.ps1' '*.psm1' '*.psd1')
          workers=$CI_WORKERS
          for ((w = 0; w < workers; w++)); do
            ( set +e
              for ((i = w; i < ${#files[@]}; i += workers)); do
                MYPY_CACHE_DIR="$out/mypy-cache.$w" python check.py "${files[$i]}" --pretty \
                  --smells-base "$base" > "$out/$i.log" 2>&1
                echo $? > "$out/$i.rc"
              done ) &
          done
          wait
          rc=0
          for i in "${!files[@]}"; do
            echo "--- ${files[$i]} ---"
            cat "$out/$i.log"
            [ "$(cat "$out/$i.rc")" = 0 ] || rc=1
          done
          exit $rc
      - name: Run test suites
        if: always()
        shell: bash
        run: |
          # Under coverage, so the suites are measured on the one pass.
          # Subprocess tracing needs this .pth AND COVERAGE_PROCESS_START:
          # several suites drive a tool as a subprocess, and untraced, that
          # tested code reads as a gap.
          site=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$site/zz-subprocess-coverage.pth"
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          rm -f .coverage .coverage.*
          # CI_WORKERS at once. .coveragerc's parallel = True gives each
          # process its own data file, combined below. Each suite writes its
          # own log, printed afterwards in suite order. Each job runs with
          # `set +e`, as in the step above, so a failing suite is recorded
          # and printed rather than killing the step.
          # The shell suites too: the acceptance suite drives the real CLI.
          # PYTHON=python so it runs the interpreter the .pth is installed in.
          out=$(mktemp -d)
          suites=(tests/test_*.py tests/test_*.sh)
          for i in "${!suites[@]}"; do
            t=${suites[$i]}
            ( set +e
              case "$t" in
                *.py) python -m coverage run "$t" > "$out/$i.log" 2>&1 ;;
                *.sh) PYTHON=python bash "$t" > "$out/$i.log" 2>&1 ;;
              esac
              echo $? > "$out/$i.rc" ) &
            while [ "$(jobs -rp | wc -l)" -ge "$CI_WORKERS" ]; do wait -n; done
          done
          wait
          rc=0
          for i in "${!suites[@]}"; do
            echo "--- ${suites[$i]} ---"
            cat "$out/$i.log"
            [ "$(cat "$out/$i.rc")" = 0 ] || rc=1
          done
          python -m coverage combine || true
          exit $rc
      - name: Coverage
        if: always()
        run: |
          # Gated where a threshold has been earned, printed everywhere else.
          # .coveragerc does not honour `pragma: no cover`: the pragma is a
          # documented claim, policed by check.py's no-cover check and listed by
          # list-exemptions.py, and it buys no better number. See docs/coverage.md.
          echo "GATED (must not regress):"
          python -m coverage report --include='spool-audit.py,spoolaudit/*' --fail-under=90
          echo
          echo "Everything measured:"
          python -m coverage report || true
          echo
          echo "Coverage exemptions, which coverage does not hide:"
          python list-exemptions.py . || true
          echo
          echo "Suppressions, every language, the ones check.py lets pass included:"
          python list-suppressions.py . || true
      # Every mutant spec in tests/mutants: each test must fail when the code
      # it pins is broken, on the check it is aimed at. A test that stopped
      # running (a tool that crashes and reads as a skip) lets its mutants
      # survive, so this fails too. One line per spec; a spec that is not all
      # killed on target has its whole output printed after. CI_WORKERS runs
      # at once, as the other steps. The copies go in a temporary directory:
      # the job runs as fleet-ci, which cannot write the checkout's parent.
      - name: Mutant specs
        if: always()
        shell: bash
        run: |
          out=$(mktemp -d)
          copies=$(mktemp -d)
          shopt -s nullglob
          set +e
          MUTATE_OUT_DIR="$out" MUTATE_COPY_DIR="$copies" \
            python mutate-spec.py --jobs "$CI_WORKERS" . tests/mutants/*.json
          rc=$?
          for f in "$out"/*.mutate.out; do
            case "$(tail -n 1 "$f")" in
              *"every one killed on target"*) ;;
              *) echo "--- $f ---"; cat "$f" ;;
            esac
          done
          exit $rc

  # Mutation testing with mutmut (mutmut-gate.py): a PR re-tests only the
  # functions it changed, against the state the nightly full run
  # (mutmut-nightly.yml) leaves in the runner volume mutmut-state, mounted
  # read-only and copied out first so parallel runs never share it. A function
  # with more survivors than the nightly baseline fails, and a new function
  # fails on any survivor. With no state in the volume there is no baseline, so
  # the job fails as could-not-look rather than pass.
  # On a PR the volume is read-only and the job's results are thrown away; a
  # push to master (the job below) is what keeps the state current, so a PR
  # re-tests only its own changes, not everything merged since the nightly.
  mutation:
    name: Mutation (mutmut, changed functions)
    if: github.event_name == 'pull_request'  # a push to master moves the state instead (mutation-state)
    runs-on: fleet-ci
    container:
      image: fleet-ci:current
      options: -v mutmut-state:/mutmut-state:ro
    steps:
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # The same script in all three mutmut jobs, so they cannot drift.
      - name: Tools for mutmut
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          OWNER: ${{ vars.LIBRARIES_OWNER }}
          SERVER: ${{ github.server_url }}
        run: bash ci-image/mutation-tools.sh
      - name: Mutants of the changed functions
        shell: bash
        run: |
          bash ci-image/fetch-mutmut-state.sh /mutmut-state
          python mutmut-gate.py run --max-children "$MUTMUT_WORKERS"
          python -m mutmut results --all true > mutmut-results.txt
          python mutmut-gate.py gate mutmut-baseline.json --results mutmut-results.txt

  # After each merge: the state moves to master. Only the functions the merge
  # changed are re-tested, from the state the volume holds; the result is
  # gated against the old baseline first (a merge that broke the rule
  # publishes nothing and fails here), then recorded as the new baseline and
  # swapped in. The nightly still re-runs everything.
  mutation-state:
    name: Mutation state onto master
    if: github.event_name == 'push'
    runs-on: fleet-ci
    container:
      image: fleet-ci:current
      options: -v mutmut-state:/mutmut-state
    steps:
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Tools for mutmut
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          OWNER: ${{ vars.LIBRARIES_OWNER }}
          SERVER: ${{ github.server_url }}
        run: bash ci-image/mutation-tools.sh
      - name: The merge's changed functions, then the state
        shell: bash
        run: |
          bash ci-image/fetch-mutmut-state.sh /mutmut-state
          python mutmut-gate.py run --max-children "$MUTMUT_WORKERS"
          python -m mutmut results --all true > mutmut-results.txt
          python mutmut-gate.py gate mutmut-baseline.json --results mutmut-results.txt
          python mutmut-gate.py record baseline.json --results mutmut-results.txt
          bash ci-image/publish-mutmut-state.sh /mutmut-state

  js:
    name: JS (eslint, prettier)
    runs-on: fleet-ci
    steps:
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - name: Tools installed at their pins
        run: python check-pins.py js
      # As the Python job's gate step: CI_WORKERS workers, each taking every
      # Nth file, each file's log printed afterwards in file order, and each
      # worker with `set +e` so a finding is recorded rather than fatal.
      - name: Check every JS file
        shell: bash
        env:
          SMELLS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$SMELLS_BASE"
          case "$base" in *[!0]*) ;; *) base="" ;; esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base commit $base is not in this clone's history (a force-push?)."
            base=""
          fi
          if [ -z "$base" ]; then
            echo "No base commit to judge smells against: HEAD is used, so a new smell only warns."
            base=HEAD
          fi
          out=$(mktemp -d)
          mapfile -t files < <(git ls-files '*.js' '*.mjs' '*.cjs')
          workers=$CI_WORKERS
          for ((w = 0; w < workers; w++)); do
            ( set +e
              for ((i = w; i < ${#files[@]}; i += workers)); do
                python check.py "${files[$i]}" --pretty --smells-base "$base" > "$out/$i.log" 2>&1
                echo $? > "$out/$i.rc"
              done ) &
          done
          wait
          rc=0
          for i in "${!files[@]}"; do
            echo "--- ${files[$i]} ---"
            cat "$out/$i.log"
            [ "$(cat "$out/$i.rc")" = 0 ] || rc=1
          done
          exit $rc
