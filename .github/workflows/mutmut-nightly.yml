# The nightly full mutmut run over master, and its state into the runner volume
# mutmut-state, which check.yml's mutation job reads (read-only) to re-test only
# what a PR changed. It runs as the fleet-ci user in the fleet-ci image, with
# the volume mounted read-write, so nothing outside the runner is involved.
#
# 06:30 UTC: after the runner's nightly reap (it starts between 00:00 and 01:00
# local) and before the box's corpus refresh (04:30 to 05:00 local), in EDT
# and EST alike. A full run is about 40 minutes on 8 cores; --cpus and
# --memory hold it to that share of the box.
#
# What it leaves, /mutmut-state/current/:
#   mutants/       mutmut's state, without mutmut-gate's git link (a PR job's
#                  prepare rebuilds it) and without anything a mutant wrote
#                  that git does not track
#   baseline.json  survivors per function (mutmut-gate.py record)
# A new state is written beside the old one and renamed in: a PR job reads the
# old state or the new one, never half of each.
#
# Who can write the volume: any job on this runner can mount it read-write,
# because the runner admits volumes per runner, not per repository. The
# runner serves only this forge's owner and seats, and a pull request that
# edits a workflow can change any check a workflow makes, so a checksum kept
# where a workflow can read it would guard nothing.

name: Mutation (nightly)

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  full-run:
    name: mutmut, every mutant, into mutmut-state
    runs-on: fleet-ci
    timeout-minutes: 90
    container:
      image: fleet-ci:current
      options: --cpus 8 --memory 8g -v mutmut-state:/mutmut-state
    steps:
      - name: CI does not run as root
        run: |
          echo "user: $(id -un) uid $(id -u)"
          if [ "$(id -u)" = 0 ]; then echo "CI is running as root: use the fleet-ci label" >&2; exit 1; fi
      - name: The volume is mounted and writable
        run: |
          probe=/mutmut-state/.write-probe-$$
          if ! touch "$probe"; then
            echo "mutmut-state is not mounted read-write at /mutmut-state" >&2
            exit 2
          fi
          rm -f "$probe"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # The same script as check.yml's two mutmut jobs, so they cannot drift.
      - name: Tools for mutmut
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          OWNER: ${{ vars.ITERATION8_LIBRARIES_OWNER }}
          SERVER: ${{ github.server_url }}
        run: bash ci-image/mutation-tools.sh
      - name: Every mutant
        run: python mutmut-gate.py run --full --max-children 8
      - name: Survivors per function
        run: |
          python -m mutmut results --all true > mutmut-results.txt
          python mutmut-gate.py record baseline.json --results mutmut-results.txt
      - name: Into the volume
        run: bash ci-image/publish-mutmut-state.sh /mutmut-state
