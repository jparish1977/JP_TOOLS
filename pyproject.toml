# JP_TOOLS declares itself here: its name, the Python it needs, and what its
# scripts import beyond the standard library (METHODOLOGY §7 item 10).
# tests/test_pyproject.py fails when an import is not declared here.
#
# [tool.pytest.ini_options] and [tool.mutmut] configure mutation testing; see
# the tables below.
#
# No [tool.ruff] or [tool.mypy], on purpose. check.py treats either table as
# the project's own config and stops applying configs/ruff.toml and
# configs/mypy.ini. The gate's own tools are declared elsewhere:
# requirements-dev.txt (Python), requirements-system.txt (apt), package.json
# (JS) and composer.json (PHP).
#
# No [build-system]: JP_TOOLS is a directory of scripts run in place, not a
# package anything installs.

[project]
name = "jp-tools"
# No releases exist; nothing reads this. PEP 621 requires the field.
version = "0.1.0"
description = "Developer toolbox for code quality, data recovery, file analysis, and archive management."
# The code itself needs 3.11 (tomllib). 3.12 because configs/ruff.toml, which
# gates this repo, targets py312, so fix.py may write 3.12 syntax; CI runs 3.12.
requires-python = ">=3.12"
# Standard library only.
dependencies = []

[project.optional-dependencies]
# autoit-extract.py only. It imports this inside a try and exits naming the
# install when absent. It uses the package's internal modules, and 1.2.0 is
# the release its docstring describes.
autoit = ["autoit-ripper==1.2.0"]

# The suites are plain scripts (`python tests/test_x.py`); pytest runs them only
# for mutmut. Only test_* functions are tests (git_test_* in
# test_check_baseline.py, which needs git): pytest's default prefix "test"
# would also collect helpers such as tests_job and take their parameters for
# fixtures. A suite run from main() is collected by tests/conftest.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*", "git_test_*"]
addopts = ["-p", "no:cacheprovider"]

# What mutmut mutates: every package and top-level script. Not tools/ (all
# lab code, METHODOLOGY 2.9) and not tests/. Not the four scripts whose suites
# must run them as processes, because they drive git hooks and child
# processes (install-hooks.py, fix-dashes.py, mutate-on-target.py,
# mutate-spec.py): mutmut cannot see a test in another process, so they stay
# on hand-written tests/mutants specs. tests/test_mutmut_config.py holds
# these lists to the tracked files. also_copy is everything else the suites
# read from the checkout, so they run in mutmut's copy (mutants/) as they do
# in the tree. The installed node_modules/ and vendor/ are LINKED into
# mutants/ by the run, not copied: a copy turns node_modules' .bin symlinks
# into files and eslint and stylelint stop honouring disable comments, and
# mutmut re-copies also_copy on every run, which fails on the read-only git
# packs composer leaves under vendor/.
# tests/mutants keeps a hand spec only where mutmut cannot judge: the four
# scripts above; shell, PHP and config files, which it does not mutate;
# module-level code (constants, compiled patterns), since it mutates only
# inside functions; and code its tests reach only through a child process,
# which it records as having no tests (#217).
# One test is left out of mutmut's runs: test_pyproject's import scan reads
# the source text, and in the copy every mutated file imports mutmut itself.
# It checks declarations, not behaviour, and runs in the ordinary suites.
# A mutant is stopped at (its tests' estimated time + timeout_constant) x
# timeout_multiplier x 2 seconds of CPU. mutmut's default multiplier, 15, let
# a mutant that loops spin a core for over seven minutes against a 14-second
# estimate while the other 17,966 had finished. mutmut counts a timeout as a
# kill, so the limit stays well above a test's normal spread: 10x the estimate.
[tool.mutmut]
timeout_multiplier = 5.0
pytest_add_cli_args = ["--deselect", "tests/test_pyproject.py::test_every_import_is_declared"]
source_paths = [
    "chdmap/", "chdtool/", "inventory/", "jpcheck/", "jpexit/", "ntfstools/",
    "platformtools/", "recovery/", "spoolaudit/",
    "autoit-extract.py", "chd-hunkmap.py", "chd.py", "check-pins.py", "check.py",
    "count-callers.py", "coverage-gate.py", "deploy-all.py", "deploy-s3.py",
    "diff-functions.py", "fix.py", "gh-comment.py", "image-disk.py",
    "init-ci.py", "install-issue-templates.py",
    "inventory-drive.py", "list-exemptions.py", "list-suppressions.py",
    "mutmut-gate.py", "ntfs-extract.py", "ntfs-inventory.py",
    "ntfs-size.py", "recover.py", "scan-image.py", "snapshot-test.py",
    "spool-audit.py", "undelete.py", "vm-image-boot.py",
]
also_copy = [
    ".coveragerc", ".gitattributes", ".github/", ".gitignore", ".jp-tools-ignore",
    "METHODOLOGY.md", "README.md", "ci-image/", "composer.json", "configs/", "docs/",
    "find-dupes.php", "fix-eval-const.mjs", "fix-style.mjs", "hooks/",
    "install-pwsh.sh", "install-recovery.ps1", "install-recovery.sh", "install.ps1",
    "install.sh", "jp_eslint.mjs", "jp_measure.mjs", "jp_node_hooks.mjs",
    "jp_node_resolve.mjs", "jp_php_ast.php", "jp_stylelint.mjs", "lib/", "oob/",
    "package.json", "requirements-dev.txt", "requirements-system.txt", "templates/",
    "tools/",
    "install-hooks.py", "fix-dashes.py", "mutate-on-target.py", "mutate-spec.py",
]
