[mypy]
# JP_TOOLS shared mypy configuration. check.py passes it explicitly with
# --config-file; a project's own mypy config takes precedence.
#
# strict, because METHODOLOGY section 2.5 says "mypy strict": a gate quieter
# than the manual beside it is worse than either setting alone.
strict = True

# No python_version pin: mypy uses the interpreter it runs under, which is the
# 3.12 CI installs and the code targets.

# Third-party stubs are not the project's problem. check.py passes
# --ignore-missing-imports too, so a direct mypy call matches one via check.py.
ignore_missing_imports = True

# Output. No trailing comments on these values: mypy's ini parser reads
# "False    # a comment" as the literal value and rejects it.
show_error_codes = True
pretty = False
