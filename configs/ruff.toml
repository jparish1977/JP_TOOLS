# JP_TOOLS shared ruff configuration
# check.py applies it to a project with no ruff config of its own. A project
# that has one extends this file rather than copying it:
#
#     extend = "${JP_TOOLS_ROOT:-../JP_TOOLS}/configs/ruff.toml"
#
# check.py and fix.py set JP_TOOLS_ROOT to the JP_TOOLS running them, so this
# resolves from a git worktree too; unset, it is JP_TOOLS checked out beside.

line-length = 100
# Matches the CI runner (3.12).
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific

    # Chosen against what code like this actually does, rather than inherited
    # from whatever the installed ruff defaults to.
    "DTZ",      # naive datetime: inventories and logs record mtimes
    "EXE",      # shebang/executable-bit agreement: this repo is scripts
    "ISC",      # implicit string concatenation
    "BLE",      # blind except
    "PLW1510",  # subprocess.run without an explicit check=
    "S110",     # try/except/pass, which swallows the error entirely
]
ignore = [
    "E501",   # line too long: handled by formatter, not linter
    "B008",   # do not perform function calls in default arguments (common in Tkinter/UI)
    "SIM108", # ternary operator: sometimes less readable
]

[lint.isort]
# JP_TOOLS' own packages, the test harness that puts them on sys.path, and
# the test support module that imports them. _harness is forced to the top of
# the section so it is always imported before what it makes importable.
known-first-party = ["jpcheck", "jpexit", "spoolaudit", "chdtool", "chdmap", "recovery", "platformtools", "ntfstools", "inventory", "_harness", "spool_audit_support", "chd_support", "fake_tools", "mutmut_gate_support"]
force-to-top = ["_harness"]

[lint.per-file-ignores]
"*_test.py"  = ["S101"]  # allow assert in tests
"test_*.py"  = ["S101"]
"**/tests/*" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
